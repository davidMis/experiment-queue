# Validate the supported Linux/Python baseline and the distributable wheel.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.14 / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[dev]'

      - name: Run test suite
        run: python -m pytest -q

      - name: Build and verify wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          wheel_path="$(find "$PWD/dist" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python scripts/verify_wheel.py "$wheel_path"

      - name: Exercise installed command help
        run: |
          experiment-queue --help
          experiment-queue-web --help
          experiment-queue-migrate-v5 --help
          experiment-queue-legacy-v4 --help
          experiment-queue-web-legacy-v4 --help
          run-experiment --help
