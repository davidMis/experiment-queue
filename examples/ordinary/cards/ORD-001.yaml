# One independently schedulable direct-argv job.
apiVersion: experiment-queue/v1
kind: ExperimentCard
metadata:
  projectKey: ordinary-example
  experimentId: ORD-001
  title: "Write one result"
spec:
  parameters: {}
  jobs:
    - id: run
      role: independent
      environment: python
      command:
        type: argv
        argv: [python, run.py]
      resources:
        gpus: 1
      artifacts:
        - name: result
          root: artifacts
          path: runs/ORD-001/result.json
          type: file
          required: true
